<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AVERION.TECH</title>

    <meta name="description" content="Selamat Datang di Averion Class">

    <!-- Open Graph -->
    <meta property="og:title" content="Averion.Tech">
    <meta property="og:description" content="Where Intelligence Meets Elegance.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="averion.png">

    <link rel="icon" href="averion.png">

    <style>

        /* =========================
           ROOT
        ========================= */

        :root {
            --bg-dark: #000000;
            --bg-navy: #00072d;
            --card: rgba(8, 13, 32, 0.88);

            --gold: #b9a15c;
            --gold-light: #d8c992;

            --text: #f2f4f8;
            --muted: #a8b0c0;

            --radius: 18px;
            --max-width: 580px;

            --shadow:
                0 20px 60px rgba(0, 0, 0, 0.65);

        }


        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(38, 53, 115, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    var(--bg-dark) 0%,
                    var(--bg-navy) 100%
                );

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 50px 20px;

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
        }


        /* =========================
           BACKGROUND ANIMATION
        ========================= */

        body::before {

            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(185, 161, 92, 0.10),
                    transparent 70%
                );

            top: -180px;
            left: -180px;

            animation:
                floatingLight 8s ease-in-out infinite alternate;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(36, 57, 130, 0.16),
                    transparent 70%
                );

            bottom: -180px;
            right: -180px;

            animation:
                floatingLight 10s ease-in-out infinite alternate-reverse;

            pointer-events: none;
        }


        @keyframes floatingLight {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(80px, 60px) scale(1.15);
            }

        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            position: relative;

            z-index: 1;
        }


        /* =========================
           WELCOME TITLE
        ========================= */

        .top-area {

            text-align: center;

            margin-bottom: 30px;

            animation:
                titleAppear 1s ease forwards;

        }


        .welcome {

            font-size: clamp(30px, 6vw, 46px);

            font-weight: 800;

            letter-spacing: -1px;

            color: #f0f3f8;

            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.08);

        }


        @keyframes titleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(-30px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =========================
           CARD
        ========================= */

        .wrap {

            width: 100%;

            max-width: var(--max-width);

            padding: 32px;

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(255, 255, 255, 0.015)
                );

            border:
                1px solid rgba(255, 255, 255, 0.06);

            box-shadow:
                var(--shadow),
                inset 0 1px rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            animation:
                cardAppear 1s ease 0.2s both;

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.96);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =========================
           PROFILE
        ========================= */

        .profile {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin-bottom: 25px;

            animation:
                profileAppear 1s ease 0.5s both;

        }


        @keyframes profileAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.85);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        /* =========================
           AVATAR
        ========================= */

        .avatar {

            width: 88px;

            height: 88px;

            flex: 0 0 88px;

            border-radius: 50%;

            overflow: hidden;

            position: relative;

            border:
                3px solid rgba(216, 201, 146, 0.45);

            background: #080d20;

            box-shadow:
                0 0 0 4px rgba(185, 161, 92, 0.05),
                0 0 25px rgba(185, 161, 92, 0.18);

            animation:
                avatarGlow 3s ease-in-out infinite;

        }


        .avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.5s ease;

        }


        .avatar:hover img {

            transform:
                scale(1.08);

        }


        @keyframes avatarGlow {

            0%,
            100% {

                box-shadow:
                    0 0 0 4px rgba(185, 161, 92, 0.05),
                    0 0 20px rgba(185, 161, 92, 0.15);

            }

            50% {

                box-shadow:
                    0 0 0 6px rgba(185, 161, 92, 0.08),
                    0 0 35px rgba(185, 161, 92, 0.30);

            }

        }


        /* =========================
           PROFILE TEXT
        ========================= */

        .profile-info {

            text-align: left;

        }


        h1 {

            font-size: 21px;

            font-weight: 800;

            margin-bottom: 5px;

            letter-spacing: 0.5px;

        }


        p.tag {

            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;

        }


        /* =========================
           LINKS
        ========================= */

        .links {

            display: flex;

            flex-direction: column;

            gap: 13px;

            margin-top: 10px;

        }


        .btn {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 54px;

            padding: 14px 20px;

            border-radius: 14px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 0.2px;

            color: #0a0a0a;

            background:
                linear-gradient(
                    100deg,
                    var(--gold),
                    var(--gold-light),
                    var(--gold)
                );

            background-size: 200% 100%;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.30);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background-position 0.5s ease;

            opacity: 0;

            animation:
                buttonAppear 0.6s ease forwards;

        }


        /* Tombol muncul satu-satu */

        .btn:nth-child(1) {
            animation-delay: 0.7s;
        }

        .btn:nth-child(2) {
            animation-delay: 0.8s;
        }

        .btn:nth-child(3) {
            animation-delay: 0.9s;
        }

        .btn:nth-child(4) {
            animation-delay: 1s;
        }

        .btn:nth-child(5) {
            animation-delay: 1.1s;
        }

        .btn:nth-child(6) {
            animation-delay: 1.2s;
        }

        .btn:nth-child(7) {
            animation-delay: 1.3s;
        }


        @keyframes buttonAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .btn:hover {

            transform:
                translateY(-4px)
                scale(1.01);

            background-position:
                100% 0;

            box-shadow:
                0 10px 25px rgba(185, 161, 92, 0.25),
                0 0 18px rgba(216, 201, 146, 0.25);

        }


        .btn:active {

            transform:
                translateY(0)
                scale(0.97);

        }


        /* =========================
           SECONDARY BUTTON
        ========================= */

        .btn.secondary {

            color: #d6dbe5;

            background:
                rgba(8, 14, 40, 0.75);

            border:
                1px solid rgba(216, 201, 146, 0.18);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

        }


        .btn.secondary:hover {

            background:
                rgba(18, 27, 62, 0.9);

            box-shadow:
                0 0 20px rgba(216, 201, 146, 0.12);

        }


        /* =========================
           GITHUB
        ========================= */

        .icons {

            display: flex;

            justify-content: center;

            margin-top: 22px;

        }


        .icons a {

            color: var(--muted);

            text-decoration: none;

            font-size: 14px;

            transition:
                color 0.25s ease,
                transform 0.25s ease;

        }


        .icons a:hover {

            color: var(--gold-light);

            transform:
                translateY(-2px);

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            margin-top: 22px;

            text-align: center;

        }


        .small {

            font-size: 12px;

            color: var(--muted);

        }


        .small a {

            color: inherit;

        }


        /* =========================
           FOCUS
        ========================= */

        .btn:focus-visible,
        .icons a:focus-visible {

            outline:
                2px solid var(--gold-light);

            outline-offset:
                4px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding:
                    30px 14px;

            }


            .wrap {

                padding:
                    24px 18px;

                border-radius:
                    22px;

            }


            .profile {

                gap:
                    14px;

            }


            .avatar {

                width:
                    76px;

                height:
                    76px;

                flex-basis:
                    76px;

            }


            h1 {

                font-size:
                    18px;

            }


            p.tag {

                font-size:
                    12px;

            }


            .btn {

                min-height:
                    52px;

            }

        }


        @media (max-width: 380px) {

            .profile {

                flex-direction:
                    column;

                text-align:
                    center;

            }


            .profile-info {

                text-align:
                    center;

            }


            .welcome {

                font-size:
                    28px;

            }

        }

    </style>
</head>

</body>

</html>
