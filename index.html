<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AVERION.TECH</title>

    <meta name="description" content="Selamat Datang di Averion Class">

    <meta property="og:title" content="Averion.Tech">
    <meta property="og:description" content="Where Intelligence Meets Elegance.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="averion.png">

    <link rel="icon" href="averion.png">

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #f5f7ff;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(55, 72, 170, 0.22),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 20% 70%,
                    rgba(87, 42, 150, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 40%,
                    rgba(20, 70, 150, 0.16),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #02030a 0%,
                    #050819 45%,
                    #020313 100%
                );

            -webkit-font-smoothing: antialiased;
        }


        /* =========================================
           SPACE BACKGROUND
        ========================================= */

        .space {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        /* Nebula */

        .nebula {
            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            filter: blur(60px);

            opacity: 0.35;

            animation:
                nebulaMove 14s ease-in-out infinite alternate;
        }

        .nebula.one {
            top: -300px;
            left: -200px;

            background:
                radial-gradient(
                    circle,
                    rgba(52, 72, 190, 0.45),
                    transparent 68%
                );
        }

        .nebula.two {
            right: -280px;
            bottom: -250px;

            background:
                radial-gradient(
                    circle,
                    rgba(105, 50, 180, 0.35),
                    transparent 68%
                );

            animation-delay: 3s;
        }

        .nebula.three {
            top: 30%;
            left: 40%;

            width: 450px;
            height: 450px;

            background:
                radial-gradient(
                    circle,
                    rgba(30, 80, 180, 0.18),
                    transparent 70%
                );

            animation-delay: 5s;
        }


        @keyframes nebulaMove {

            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(80px, 50px) scale(1.15);
            }

        }


        /* =========================================
           STARS
        ========================================= */

        .stars {
            position: absolute;
            inset: 0;
        }

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 6px rgba(255,255,255,0.8);

            animation:
                twinkle 3s ease-in-out infinite;
        }


        .star:nth-child(1) {
            top: 10%;
            left: 8%;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            top: 18%;
            left: 22%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 8%;
            left: 42%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            top: 25%;
            left: 65%;
            animation-delay: .5s;
        }

        .star:nth-child(5) {
            top: 12%;
            left: 86%;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            top: 42%;
            left: 5%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            top: 48%;
            left: 17%;
            animation-delay: 1.2s;
        }

        .star:nth-child(8) {
            top: 55%;
            left: 91%;
            animation-delay: .7s;
        }

        .star:nth-child(9) {
            top: 70%;
            left: 8%;
            animation-delay: 2s;
        }

        .star:nth-child(10) {
            top: 76%;
            left: 28%;
            animation-delay: .3s;
        }

        .star:nth-child(11) {
            top: 83%;
            left: 72%;
            animation-delay: 1.8s;
        }

        .star:nth-child(12) {
            top: 66%;
            left: 94%;
            animation-delay: 2.8s;
        }

        .star:nth-child(13) {
            top: 90%;
            left: 48%;
            animation-delay: 1.1s;
        }

        .star:nth-child(14) {
            top: 34%;
            left: 79%;
            animation-delay: 2.2s;
        }

        .star:nth-child(15) {
            top: 58%;
            left: 38%;
            animation-delay: .8s;
        }


        @keyframes twinkle {

            0%,
            100% {
                opacity: .25;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }

        }


        /* =========================================
           SHOOTING STAR
        ========================================= */

        .shooting-star {
            position: absolute;

            width: 120px;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.9),
                    transparent
                );

            transform: rotate(-35deg);

            opacity: 0;

            animation:
                shootingStar 8s linear infinite;
        }

        .shooting-star.one {
            top: 18%;
            left: -150px;

            animation-delay: 2s;
        }

        .shooting-star.two {
            top: 55%;
            left: -150px;

            animation-delay: 6s;
        }


        @keyframes shootingStar {

            0% {
                transform:
                    translate(0,0)
                    rotate(-35deg);

                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            20% {
                transform:
                    translate(700px,400px)
                    rotate(-35deg);

                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* =========================================
           PLANET
        ========================================= */

        .planet {
            position: absolute;

            border-radius: 50%;

            pointer-events: none;
        }


        .planet.one {
            width: 70px;
            height: 70px;

            right: 8%;
            top: 18%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #9aa8e8,
                    #38447f 45%,
                    #10152f 75%
                );

            box-shadow:
                inset -12px -10px 20px rgba(0,0,0,.6),
                0 0 25px rgba(71,87,180,.2);

            animation:
                planetFloat 7s ease-in-out infinite alternate;
        }


        .planet.one::after {
            content: "";

            position: absolute;

            width: 110px;
            height: 25px;

            top: 22px;
            left: -20px;

            border:
                2px solid rgba(185,190,230,.3);

            border-radius: 50%;

            transform: rotate(-20deg);
        }


        .planet.two {
            width: 35px;
            height: 35px;

            left: 7%;
            bottom: 18%;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #cbb47c,
                    #6b5630 50%,
                    #201a10 80%
                );

            box-shadow:
                0 0 20px rgba(185,161,92,.12);

            animation:
                planetFloat 9s ease-in-out infinite alternate-reverse;
        }


        @keyframes planetFloat {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(20px);
            }

        }


        /* =========================================
           PAGE
        ========================================= */

        .page {
            width: 100%;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                55px 20px 30px;

            position: relative;

            z-index: 1;
        }


        /* =========================================
           TITLE
        ========================================= */

        .top-area {
            text-align: center;

            margin-bottom: 30px;

            animation:
                titleAppear 1s ease both;
        }


        .welcome {
            font-size:
                clamp(30px, 6vw, 46px);

            font-weight: 800;

            letter-spacing: -1px;

            color: #f4f6ff;

            text-shadow:
                0 0 25px rgba(100,120,255,.15);
        }


        .welcome::after {
            content: "";

            display: block;

            width: 75px;
            height: 3px;

            margin:
                14px auto 0;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d8c992,
                    transparent
                );

            animation:
                lineGlow 3s ease-in-out infinite;
        }


        @keyframes titleAppear {

            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes lineGlow {

            0%,
            100% {
                width: 50px;
                opacity: .4;
            }

            50% {
                width: 100px;
                opacity: 1;
            }

        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .wrap {
            width: 100%;

            max-width: 580px;

            padding: 30px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,24,50,.82),
                    rgba(3,7,25,.88)
                );

            border:
                1px solid rgba(160,170,220,.12);

            box-shadow:
                0 30px 80px rgba(0,0,0,.7),
                0 0 50px rgba(40,60,150,.08),
                inset 0 1px rgba(255,255,255,.06);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            animation:
                cardAppear 1s ease .2s both;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================
           PROFILE
        ========================================= */

        .profile {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin-bottom: 25px;

            animation:
                profileAppear 1s ease .5s both;
        }


        @keyframes profileAppear {

            from {
                opacity: 0;
                transform: scale(.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* =========================================
           AVATAR
        ========================================= */

        .avatar {
            width: 88px;
            height: 88px;

            flex: 0 0 88px;

            overflow: hidden;

            border-radius: 50%;

            border:
                3px solid rgba(216,201,146,.5);

            background: #080d20;

            box-shadow:
                0 0 0 4px rgba(185,161,92,.05),
                0 0 28px rgba(185,161,92,.2);

            animation:
                avatarGlow 3s ease-in-out infinite;
        }


        .avatar img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform .5s ease;
        }


        .avatar:hover img {
            transform: scale(1.08);
        }


        @keyframes avatarGlow {

            0%,
            100% {
                box-shadow:
                    0 0 0 4px rgba(185,161,92,.05),
                    0 0 20px rgba(185,161,92,.15);
            }

            50% {
                box-shadow:
                    0 0 0 6px rgba(185,161,92,.08),
                    0 0 35px rgba(185,161,92,.3);
            }

        }


        /* =========================================
           PROFILE TEXT
        ========================================= */

        .profile-info {
            text-align: left;
        }


        h1 {
            font-size: 21px;

            font-weight: 800;

            margin-bottom: 5px;

            letter-spacing: .5px;
        }


        p.tag {
            color: #a8b0c0;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================================
           LINKS
        ========================================= */

        .links {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .btn {
            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 54px;

            padding: 14px 20px;

            border-radius: 14px;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            color: #080808;

            background:
                linear-gradient(
                    100deg,
                    #b9a15c,
                    #e0d29a,
                    #b9a15c
                );

            background-size: 200% 100%;

            box-shadow:
                0 8px 20px rgba(0,0,0,.3);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background-position .5s ease;

            opacity: 0;

            animation:
                buttonAppear .6s ease forwards;
        }


        .btn:nth-child(1) {
            animation-delay: .7s;
        }

        .btn:nth-child(2) {
            animation-delay: .8s;
        }

        .btn:nth-child(3) {
            animation-delay: .9s;
        }

        .btn:nth-child(4) {
            animation-delay: 1s;
        }

        .btn:nth-child(5) {
            animation-delay: 1.1s;
        }

        .btn:nth-child(6) {
            animation-delay: 1.2s;
        }

        .btn:nth-child(7) {
            animation-delay: 1.3s;
        }


        @keyframes buttonAppear {

            from {
                opacity: 0;

                transform:
                    translateY(18px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        .btn:hover {
            transform:
                translateY(-4px)
                scale(1.01);

            background-position:
                100% 0;

            box-shadow:
                0 12px 28px rgba(185,161,92,.25),
                0 0 20px rgba(216,201,146,.22);
        }


        .btn:active {
            transform:
                translateY(0)
                scale(.97);
        }


        /* =========================================
           EMAIL BUTTON
        ========================================= */

        .btn.secondary {
            color: #dce1eb;

            background:
                rgba(6,12,38,.72);

            border:
                1px solid rgba(216,201,146,.18);
        }


        .btn.secondary:hover {
            background:
                rgba(18,27,65,.9);

            box-shadow:
                0 0 20px rgba(216,201,146,.12);
        }


        /* =========================================
           GITHUB
        ========================================= */

        .icons {
            display: flex;

            justify-content: center;

            margin-top: 20px;
        }


        .icons a {
            color: #9da6b8;

            text-decoration: none;

            font-size: 14px;

            transition:
                color .25s ease,
                transform .25s ease;
        }


        .icons a:hover {
            color: #d8c992;

            transform:
                translateY(-2px);
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {
            margin-top: 18px;

            text-align: center;
        }


        .small {
            font-size: 12px;

            color: #8e98aa;
        }


        .small a {
            color: inherit;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .page {
                padding:
                    35px 14px 25px;
            }

            .wrap {
                padding:
                    24px 18px;

                border-radius:
                    22px;
            }

            .profile {
                gap: 14px;
            }

            .avatar {
                width: 76px;
                height: 76px;

                flex-basis: 76px;
            }

            h1 {
                font-size: 18px;
            }

            p.tag {
                font-size: 12px;
            }

            .btn {
                min-height: 52px;
            }

            .planet.one {
                right: -20px;
            }

        }


        @media (max-width: 380px) {

            .profile {
                flex-direction: column;

                text-align: center;
            }

            .profile-info {
                text-align: center;
            }

            .welcome {
                font-size: 28px;
            }

        }


        /* =========================================
           REDUCE MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }

        }

    </style>
</head>


<body>
